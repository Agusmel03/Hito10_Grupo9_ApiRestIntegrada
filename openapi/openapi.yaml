          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Team_'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '422':
