  /health/live:
    get:
      tags:
      - Operacion
      summary: Verificar el proceso HTTP
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Live Health Live Get
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
