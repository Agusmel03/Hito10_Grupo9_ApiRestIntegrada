components:
  schemas:
    Comment:
      properties:
        comentario_id:
          type: string
          format: uuid
          title: Comentario Id
        creado_en:
          type: string
          format: date-time
          title: Creado En
        usuario_id:
          type: string
          title: Usuario Id
        contenido:
          type: string
          title: Contenido
      additionalProperties: false
      type: object
      required:
      - comentario_id
      - creado_en
      - usuario_id
      - contenido
      title: Comment
    Comments:
      properties:
        partido_id:
          type: string
          pattern: ^P[0-9]{3,9}$
          title: Partido Id
          examples:
          - P001
        bucket_10m:
          type: string
          format: date-time
          title: Bucket 10M
        shard:
          type: integer
          title: Shard
        items:
          items:
            $ref: '#/components/schemas/Comment'
          type: array
          title: Items
        siguiente_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Siguiente Cursor
      additionalProperties: false
      type: object
      required:
      - partido_id
      - bucket_10m
      - shard
      - items
      - siguiente_cursor
      title: Comments
    DependencyStatus:
      properties:
        estado:
          type: string
          enum:
          - ok
          - no_disponible
          - error
          title: Estado
        duracion_ms:
          type: number
          title: Duracion Ms
      additionalProperties: false
      type: object
      required:
      - estado
      - duracion_ms
      title: DependencyStatus
    Envelope_Comments_:
      properties:
        data:
          $ref: '#/components/schemas/Comments'
      additionalProperties: false
      type: object
      required:
      - data
      title: Envelope[Comments]
    Envelope_Events_:
      properties:
        data:
          $ref: '#/components/schemas/Events'
      additionalProperties: false
      type: object
      required:
      - data
      title: Envelope[Events]
    Envelope_Health_:
      properties:
        data:
          $ref: '#/components/schemas/Health'
      additionalProperties: false
      type: object
      required:
      - data
      title: Envelope[Health]
    Envelope_MatchObject_:
      properties:
        data:
          $ref: '#/components/schemas/MatchObject'
      additionalProperties: false
      type: object
      required:
      - data
      title: Envelope[MatchObject]
    Envelope_Session_:
      properties:
        data:
          $ref: '#/components/schemas/Session'
      additionalProperties: false
      type: object
      required:
      - data
      title: Envelope[Session]
    Envelope_Statistics_:
      properties:
        data:
          $ref: '#/components/schemas/Statistics'
      additionalProperties: false
      type: object
      required:
      - data
      title: Envelope[Statistics]
    Envelope_Team_:
      properties:
        data:
          $ref: '#/components/schemas/Team'
      additionalProperties: false
      type: object
      required:
      - data
      title: Envelope[Team]
    Envelope_Teams_:
      properties:
        data:
          $ref: '#/components/schemas/Teams'
      additionalProperties: false
      type: object
      required:
      - data
      title: Envelope[Teams]
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        request_id:
          type: string
          title: Request Id
        dependency:
          anyOf:
          - type: string
          - type: 'null'
          title: Dependency
        fields:
          items:
            type: string
          type: array
          title: Fields
          default: []
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - request_id
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
    Events:
      properties:
        partido_id:
          type: string
          pattern: ^P[0-9]{3,9}$
          title: Partido Id
          examples:
          - P001
        items:
          items:
            $ref: '#/components/schemas/GraphEvent'
          type: array
          title: Items
        siguiente_offset:
          anyOf:
          - type: integer
          - type: 'null'
          title: Siguiente Offset
      additionalProperties: false
      type: object
      required:
      - partido_id
      - items
      - siguiente_offset
      title: Events
    GraphEvent:
      properties:
        id_evento:
          type: string
          title: Id Evento
        tipo:
          type: string
          title: Tipo
        minuto:
          type: integer
          title: Minuto
        descripcion:
          anyOf:
          - type: string
          - type: 'null'
          title: Descripcion
        jugador_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Jugador Id
      additionalProperties: false
      type: object
      required:
      - id_evento
      - tipo
      - minuto
      title: GraphEvent
    Health:
      properties:
        estado:
          type: string
          enum:
          - ok
          - degradado
          title: Estado
        dependencias:
          additionalProperties:
            $ref: '#/components/schemas/DependencyStatus'
          type: object
          title: Dependencias
      additionalProperties: false
      type: object
      required:
      - estado
      - dependencias
      title: Health
    MatchObject:
      properties:
        id:
          type: string
          title: Id
        partido_id:
          type: string
          pattern: ^P[0-9]{3,9}$
          title: Partido Id
          examples:
          - P001
        equipo_local:
          type: string
          title: Equipo Local
        equipo_visitante:
          type: string
          title: Equipo Visitante
        fecha:
          type: string
          format: date-time
          title: Fecha
        sede:
          type: string
          title: Sede
        estado:
