          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '503':
          description: Una o mas dependencias no disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Health_'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '500':
