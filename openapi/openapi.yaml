                type: string
                format: uuid
        '503':
          description: Dependencia inaccesible o timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '500':
          description: Error interno seguro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '404':
          description: Recurso inexistente o sesion sin vigencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
  /api/v1/partidos/{partido_id}/eventos:
    get:
      tags:
      - Neo4j
      summary: Consultar eventos y protagonistas de un partido
      operationId: events_api_v1_partidos__partido_id__eventos_get
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P[0-9]{3,9}$
          examples:
          - P001
          title: Partido Id
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limite
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Events_'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '422':
          description: Entrada invalida; no se consulta la fuente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '503':
          description: Dependencia inaccesible o timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '500':
          description: Error interno seguro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '404':
          description: Recurso inexistente o sesion sin vigencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
  /api/v1/partidos/{partido_id}/comentarios:
    get:
      tags:
      - Cassandra
      summary: Leer una particion de comentarios
      description: Particion completa del Hito 6. Cursor firmado, valido por una hora
        y ligado a los parametros. Una particion vacia devuelve 200; no prueba existencia
        del partido en otros motores.
      operationId: comments_api_v1_partidos__partido_id__comentarios_get
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P[0-9]{3,9}$
          examples:
          - P001
          title: Partido Id
      - name: bucket_10m
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2030-06-10T18:00:00Z'
          title: Bucket 10M
      - name: shard
        in: query
        required: false
        schema:
          type: integer
          maximum: 7
          minimum: 0
          default: 0
          title: Shard
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 8192
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Comments_'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '422':
          description: Entrada invalida; no se consulta la fuente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '503':
          description: Dependencia inaccesible o timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '500':
          description: Error interno seguro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
  /api/v1/sesiones/{session_id}:
    get:
      tags:
      - Redis
      summary: Consultar estado y TTL de una sesion
      description: No devuelve usuario ni tokens. No renueva el TTL. Una sesion sin
        TTL, inactiva, ausente o expirada no es una sesion vigente.
      operationId: session_api_v1_sesiones__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,80}$
          examples:
          - sess-demo-001
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Session_'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '422':
          description: Entrada invalida; no se consulta la fuente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '503':
          description: Dependencia inaccesible o timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '500':
          description: Error interno seguro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '404':
          description: Recurso inexistente o sesion sin vigencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
  /api/v1/partidos/{partido_id}/estadisticas:
    get:
      tags:
      - InfluxDB
      summary: Agregar estadisticas en una ventana temporal
      description: 'Intervalo [desde,hasta), maximo 24 horas. Posesion: mean; pases
        acumulados: last; tiros y recuperaciones: sum. Hasta 1000 filas; truncado=true
        requiere reducir la ventana o aumentar resolucion. tiempo es el final de la
        ventana Flux, que puede superar hasta en una ventana parcial.'
      operationId: statistics_api_v1_partidos__partido_id__estadisticas_get
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P[0-9]{3,9}$
          examples:
          - P001
          title: Partido Id
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2030-06-08T19:00:00Z'
          title: Desde
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2030-06-08T20:30:00Z'
          title: Hasta
      - name: equipo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
            examples:
            - AAA
          - type: 'null'
          title: Equipo
      - name: resolucion
        in: query
        required: false
        schema:
          enum:
          - 1m
          - 5m
          - 15m
          - 1h
          type: string
          default: 5m
          title: Resolucion
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Statistics_'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '422':
          description: Entrada invalida; no se consulta la fuente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '503':
          description: Dependencia inaccesible o timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '500':
          description: Error interno seguro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
  /api/v1/objetos/partidos/{partido_id}:
    get:
      tags:
      - IRIS
      summary: Consultar un partido persistente y sus eventos hijos
      description: Vista SQL de las clases Fixture2030.Partido y Evento del Hito 9.
        Fecha conserva el timestamp local original sin asignarle una zona no documentada.
      operationId: match_api_v1_objetos_partidos__partido_id__get
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P[0-9]{3,9}$
          examples:
          - P001
          title: Partido Id
      - name: limite_eventos
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limite Eventos
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MatchObject_'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '422':
          description: Entrada invalida; no se consulta la fuente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '503':
          description: Dependencia inaccesible o timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '500':
          description: Error interno seguro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '404':
          description: Recurso inexistente o sesion sin vigencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
  /api/v1/salud:
    get:
      tags:
      - Operacion
      summary: Comprobar conectividad real con las seis fuentes
      operationId: health_api_v1_salud_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
