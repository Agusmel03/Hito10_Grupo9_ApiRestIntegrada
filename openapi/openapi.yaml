openapi: 3.1.0
info:
  title: Fixture 2030 - API integrada Grupo 9
  description: Acceso por casos de uso a seis fuentes NoSQL. API local de laboratorio,
    de solo lectura.
  version: 1.0.0
servers:
- url: /
  description: Instancia local actual
paths:
  /api/v1/equipos:
    get:
      tags:
      - MongoDB
      summary: Listar equipos
      operationId: teams_api_v1_equipos_get
      parameters:
      - name: despues
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
            examples:
            - AAA
          - type: 'null'
          title: Despues
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limite
      - name: confederacion
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - AFC
            - CAF
            - CONCACAF
            - CONMEBOL
            - OFC
            - UEFA
            type: string
          - type: 'null'
          title: Confederacion
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Teams_'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '422':
          description: Entrada invalida; no se consulta la fuente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '503':
          description: Dependencia inaccesible o timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
        '500':
          description: Error interno seguro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: UUID de correlacion de la request y sus logs.
              schema:
                type: string
                format: uuid
  /api/v1/equipos/{codigo}:
    get:
      tags:
